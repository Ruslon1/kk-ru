model:
  type: encoder-decoder
  vocab: 32000
  tie_embeddings: true
  d_model: 768
  n_heads: 12
  head_dim: 64
  n_kv_heads_encoder: 12
  n_kv_heads_decoder_self: 4
  n_kv_heads_cross: 12
  n_encoder_layers: 16
  n_decoder_layers: 16
  ffn: swiglu
  ffn_hidden: 6144
  norm: rmsnorm
  qk_norm: true
  pos: rope
  dropout: 0.1
  max_len: 256
tokenizer:
  sp_model: data/tokenizer/kk-ru-sp32k.model
  vocab_size: 32000
data:
  train_tsv: data/filtered/train.kk-ru.tsv
  eval_dev: data/eval/flores_plus/dev.kk-ru.tsv
  eval_test: data/eval/flores_plus/devtest.kk-ru.tsv
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
train:
  precision: bf16
  micro_batch_per_gpu: 8
  grad_accum: 8
  epochs: 3
  optimizer: adamw
  lr: 2.0e-4
  warmup_steps: 2000
  schedule: cosine
  min_lr: 2.0e-5
  weight_decay: 0.01
  clip_grad_norm: 1.0
  label_smoothing: 0.1
  save_every: 2000
  eval_every: 2000
  max_steps: null
  seed: 42
  compile: false
gen:
  beam: 5
  max_len: 256
paths:
  checkpoints: checkpoints/large
  reports: reports/large
  logs: runs/large
