[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kk-ru"
version = "0.1.0"
description = "KK→RU machine translation: Qwen-style encoder–decoder (~200M), trained from scratch"
readme = "README.md"
requires-python = ">=3.10"
# Runtime deps live in requirements.txt (simpler to pin on the 4090 box).
# The package itself is installed editable with --no-deps: pip install -e . --no-deps
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
